<div class="bp-template-bpmn">
  <p class="bp-template-bpmn-note">
    The diagram is a visual representation. The execution route is defined by Steps, Transitions and backend validation.
  </p>

  <div *ngIf="loading" class="bp-template-bpmn-status">Loading process map...</div>
  <div *ngIf="error" class="bp-template-bpmn-error">{{error}}</div>

  <bp-bpmn-modeler
    *ngIf="xml && !loading"
    [xml]="xml"
    [readonly]="readonly"
    (xmlChange)="onXmlChange($event)"
    (importError)="onError($event)"
    (saveError)="onError($event)">
  </bp-bpmn-modeler>
</div>
