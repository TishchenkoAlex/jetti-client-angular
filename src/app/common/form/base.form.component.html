<div *ngIf="form$ | async as form">
  <div *ngIf="vk$ | async as vk">
    <div *ngIf="viewModel$ | async as viewModel">
      <form novalidate [formGroup]="form" cdkTrapFocus>
        <p-panel #mp
          [header]="(description$ | async)?.value + ' (' + (metadata$ | async).description + ')' + ((isPosted$ | async) ? ' [posted]' : ' [unposted]') + (readonly ? ' [readonly]' : '' )+ ((isArchived$ | async) ? ' [archived]' : '' )"
          [toggleable]="true" toggler="header">
          <p-toolbar styleClass="jetti-form-toolbar">
            <ng-template pTemplate="start">
              <div *ngIf="!isHistory && !readonly" class="jetti-toolbar-actions">
              <button pButton type="button" id="PostClose" icon="fa fa-check-square"
                [label]="type === 'BusinessProcess.Instance' ? 'Start & Close' : 'Post&Close'"
                pTooltip="Post and close" tooltipPosition="top" showDelay="2000" class="p-button-warn"
                [disabled]="!form.valid || (lds.busy$ | async)" (click)="postClose()"
                *ngIf="!(isDeleted$ | async) && type !== 'BusinessProcess.Template'"></button>
              <button pButton type="button" id="SaveTemplateClose" icon="fa fa-check-square" label="Save & Close"
                pTooltip="Save and close" tooltipPosition="top" showDelay="2000" class="p-button-warn"
                [disabled]="!form.valid || (lds.busy$ | async)" (click)="saveTemplateAndClose()"
                *ngIf="type === 'BusinessProcess.Template' && !(isDeleted$ | async)"></button>
              <button pButton type="button" id="Post" icon="fa fa-check" class="p-button-secondary" pTooltip="Post"
                tooltipPosition="top" showDelay="2000" [disabled]="!form.valid || (lds.busy$ | async)" (click)="post()"
                *ngIf="!(isDeleted$ | async) && isDoc"></button>
              <button pButton type="button" id="unPost" icon="far fa-square" class="p-button-secondary"
                pTooltip="Unpost" tooltipPosition="top" showDelay="2000" [disabled]="!form.valid || (lds.busy$ | async)"
                (click)="unPost()" *ngIf="!(isDeleted$ | async) && (isPosted$ | async) && isDoc"></button>
              <button pButton type="button" id="save" icon="far fa-save" class="p-button-secondary" pTooltip="Save"
                tooltipPosition="top" showDelay="2000" [disabled]="!form.valid || (lds.busy$ | async)" (click)="save()"
                *ngIf="!(isPosted$ | async) || !isDoc"></button>
              <button pButton type="button" id="Copy" icon="far fa-copy" class="p-button-secondary" pTooltip="Copy"
                tooltipPosition="top" showDelay="2000" [disabled]="!form.valid || (lds.busy$ | async)" (click)="copy()"
                *ngIf="!(isDeleted$ | async)  && !(isNew$ | async)"></button>
              <button pButton type="button" id="Delete" icon="far fa-trash-alt" class="p-button-danger"
                pTooltip="Delete" tooltipPosition="top" showDelay="2000"
                *ngIf="!(isNew$ | async) && type !== 'BusinessProcess.Template' && type !== 'BusinessProcess.Instance'" (click)="delete()"
                [disabled]="(lds.busy$ | async)"></button>
              </div>
            </ng-template>
            <ng-template pTemplate="end">
              <div *ngIf="!isHistory" class="jetti-toolbar-actions">
              <p-splitButton *ngIf="(copyTo$ | async)?.length" [model]="copyTo$ | async"
                styleClass="p-button-secondary" label="base on">
              </p-splitButton>
              <p-splitButton *ngIf="!(isNew$ | async)" [model]="navigateCommands" styleClass="p-button-secondary"
                label="navigate">
              </p-splitButton>
              <p-splitButton *ngIf="(commands$ | async)?.length" [model]="commands$ | async"
                styleClass="p-button-secondary" label="commands">
              </p-splitButton>
              <button *ngIf="(isPosted$ | async)" pButton type="button" icon="pi pi-print" class="p-button-secondary"
                pTooltip="Print" tooltipPosition="top" showDelay="2000" [disabled]="(lds.busy$ | async)"
                (click)="print()"></button>
              <button pButton type="button" icon="pi pi-refresh" class="p-button-secondary" pTooltip="Refresh"
                tooltipPosition="top" showDelay="2000" [disabled]="(lds.busy$ | async)" (click)="refresh()"></button>
              </div>
            </ng-template>
          </p-toolbar>

          <div class="jetti-dynamic-form" cdkTrapFocus [cdkTrapFocusAutoCapture]="true" cdkFocusInitial
            *ngIf="v$ | async as v">

            <div class="jetti-form-grid"
              *ngFor="let i of [0,3,6,9,12,15,18,21,24,27,30]">
              <div class="jetti-form-grid-cell" *ngFor="let d of [0,1,2]">
                <j-control *ngIf="headFields[i+d]" [control]="headFields[i+d]" [form]="form">
                </j-control>
              </div>
            </div>

            <br *ngIf="fieldsetsFields.length > 0">
            <p-fieldset *ngIf="fieldsetsFields.length > 0" legend="Ещё..." [toggleable]="true" collapsed=true>
              <div class="jetti-form-grid"
                *ngFor="let i of [0,3,6,9,12,15,18,21,24,27,30]">
                <div class="jetti-form-grid-cell" *ngFor="let d of [0,1,2]">
                  <j-control *ngIf="fieldsetsFields[i+d]" [control]="fieldsetsFields[i+d]" [form]="form">
                  </j-control>
                </div>
              </div>
            </p-fieldset>

            <div *ngIf="tables$ | async as tables">
              <br *ngIf="tables.length">
              <p-tabs *ngIf="tables.length" [value]="0" class="jetti-form-tabs">
                <p-tablist>
                  <p-tab *ngFor="let c of tables; let index = index" [value]="index">{{ c.label }}</p-tab>
                </p-tablist>
                <p-tabpanels>
                  <p-tabpanel *ngFor="let c of tables; let index = index" [value]="index">
                    <j-control [control]="c" [form]="form"></j-control>
                  </p-tabpanel>
                </p-tabpanels>
              </p-tabs>
            </div>

            <j-control *ngIf="vk.info" [control]="vk.info" [form]="form"></j-control>

            <ng-content></ng-content>
          </div>

        </p-panel>

        <p-panel *ngFor="let panel of controlsPlacement" [toggleable]="true" [header]="panel.panel" [collapsed]="true"
          toggler="header" #dynamicPanel>

          <bp-business-process-template-bpmn
            *ngIf="type === 'BusinessProcess.Template' && panel.panel === 'Process map' && !dynamicPanel.collapsed"
            [form]="form" [readonly]="readonly">
          </bp-business-process-template-bpmn>

          <div class="jetti-form-grid"
            *ngFor="let i of [0,3,6,9,12,15,18,21,24,27,30]">
            <div class="jetti-form-grid-cell" *ngFor="let d of [0,1,2]">
              <j-control *ngIf="panel.standalone[i+d]" [control]="panel.standalone[i+d]" [form]="form">
              </j-control>
            </div>
          </div>

          <br *ngIf="panel.fieldsets.length > 0">
          <p-fieldset *ngFor="let fieldset of panel.fieldsets" [legend]="fieldset.fieldset" [toggleable]="true"
            collapsed=true>
            <div class="jetti-form-grid"
              *ngFor="let i of [0,3,6,9,12,15,18,21,24,27,30]">
              <div class="jetti-form-grid-cell" *ngFor="let d of [0,1,2]">
                <j-control *ngIf="fieldset.controls[i+d]" [control]="fieldset.controls[i+d]" [form]="form">
                </j-control>
              </div>
            </div>
          </p-fieldset>

          <br *ngIf="panel.tables.length > 0">
          <p-tabs *ngIf="panel.tables.length" [value]="0" class="jetti-form-tabs">
            <p-tablist>
              <p-tab *ngFor="let table of panel.tables; let index = index" [value]="index">{{ table.label }}</p-tab>
            </p-tablist>
            <p-tabpanels>
              <p-tabpanel *ngFor="let table of panel.tables; let index = index" [value]="index">
                <j-control [control]="table" [form]="form"></j-control>
              </p-tabpanel>
            </p-tabpanels>
          </p-tabs>

          <div *ngFor="let control of panel.fullwidth">
            <j-control [control]="control" [form]="form"></j-control>
          </div>

        </p-panel>

        <p-panel *ngIf="type === 'BusinessProcess.Instance'" [toggleable]="true"
          header="Process route" [collapsed]="false" toggler="header">
          <bp-business-process-instance-route [form]="form"></bp-business-process-instance-route>
        </p-panel>

        <p-panel *ngIf="type === 'BusinessProcess.Template'" [toggleable]="true"
          [header]="'Validation result [' + form.status + ']'" [collapsed]="true" toggler="header">
          <div class="jetti-form-validation-actions">
            <button pButton type="button" icon="far fa-copy" label="Copy"
              class="p-button-secondary" pTooltip="Copy validation result"
              tooltipPosition="top" (click)="copyValidationResult()"></button>
          </div>
          <pre class="jetti-form-validation-json">{{ formValidationResult | json }}</pre>
        </p-panel>

        <div *ngIf="!isHistory && type !== 'BusinessProcess.Template'">
          <p-panel *ngIf="type === 'Catalog.Operation' && (isFolder$ | async) === false" [toggleable]="true"
            header="Post script (management)" [collapsed]="true" (collapsedChange)="mp.collapse();"
            toggler="header">
            <j-control *ngIf="vk.script" [control]="vk.script" [form]="form"></j-control>
          </p-panel>

          <p-panel *ngIf="type === 'Catalog.Operation' && (isFolder$ | async) === false" [toggleable]="true"
            header="Post script (accounting)" [collapsed]="true" (collapsedChange)="mp.collapse();"
            toggler="header">
            <j-control *ngIf="vk.scriptAccounting" [control]="vk.scriptAccounting" [form]="form"></j-control>
          </p-panel>

          <p-panel *ngIf="(type === 'Catalog.Operation')" [toggleable]="true" header="Document module"
            [collapsed]="true" (collapsedChange)="mp.collapse();" toggler="header">
            <j-control *ngIf="vk.module" [control]="vk.module" [form]="form"></j-control>
          </p-panel>

          <p-panel [toggleable]="true" [collapsed]="true" header="Register movements" #movements *ngIf="isDoc"
            toggler="header">
            <j-register-movements-list *ngIf="!movements.collapsed" [doc]="viewModel">
            </j-register-movements-list>
          </p-panel>

          <div *ngIf="(isFolder$ | async) === false">
            <div *ngFor="let r of relations$ | async">
              <p-panel [toggleable]="true" [collapsed]="true" #relation [header]="r.name" toggler="header">
                <j-hierarchy-list *ngIf="!relation.collapsed && !r.type.startsWith('Register.')" [type]="r.type"
                  [pageSize]=10 [isRelationList]="true"
                  [settings]="{order: [], filter: [
                  {left: r.field, center: '=', right: {id: viewModel.id, type: viewModel.type, value: viewModel.description}}]}">
                </j-hierarchy-list>
                <j-register-info *ngIf="!relation.collapsed && r.type.startsWith('Register.Info')" [register]="r.type"
                  [filter]="[{key: r.field, value: viewModel.id}]">
                </j-register-info>
              </p-panel>
            </div>
          </div>

          <p-panel [toggleable]="true" [collapsed]="true"
            [header]="'Descendants ' + (isCatalog ? 'objects' : 'documents')" #descendants
            *ngIf="(isNew$ | async) === false" toggler="header">
            <j-descendants *ngIf="!descendants.collapsed" [doc]="viewModel"></j-descendants>
          </p-panel>

          <p-panel [toggleable]="true" [collapsed]="true" header="History" #history *ngIf="(isNew$ | async) === false"
            toggler="header">
            <j-history *ngIf="!history.collapsed" [doc]="viewModel"></j-history>
          </p-panel>

          <p-panel [toggleable]="true" [collapsed]="true" header="Attachments" #attachments
            *ngIf="(isNew$ | async) === false" toggler="header">
            <j-attachments *ngIf="!attachments.collapsed" [owner]="id"></j-attachments>
          </p-panel>
        </div>

      </form>

      <p-confirmDialog [key]="id" [closeOnEscape]="true" [closable]="true" #cdlg appendTo="body">
        <p-footer>
          <div cdkTrapFocus>
            <button type="button" pButton icon="fa fa-check" label="Yes" (click)="cdlg.onAccept()"></button>
            <button type="button" pButton icon="fas fa-times" label="No" (click)="cdlg.onReject()"></button>
          </div>
        </p-footer>
      </p-confirmDialog>
    </div>
  </div>
</div>
